name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          # ubuntu-latest 已升至 26.04，镜像里不再提供 Python 3.9（EOL）
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          # 3.9 改用 ubuntu-22.04，该镜像仍提供
          - os: ubuntu-22.04
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.9 在 ubuntu-latest 上偶尔因清单缺失失败，允许回退
          check-latest: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          pip install -e .
          pip install "pytest>=7.0"

      - name: Run tests
        run: pytest tests -q

      - name: Verify CLI works
        # CLAUDE: 这里必须显式设置 UTF-8，否则 Windows runner 会用 cp1252
        # 输出中文时抛 UnicodeEncodeError: 'charmap' codec can't encode
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        shell: bash
        run: |
          tznovel --version
          tznovel stats "examples/茅山后裔_样本.json" | head -5
          tznovel person "examples/茅山后裔_样本.json" | head -5
          tznovel premise "examples/茅山后裔_样本.json" | head -5

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade "pip<25" build
          python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

      - name: Verify wheel installs cleanly
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install dist/*.whl
          /tmp/probe/bin/tznovel --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
