[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tznovel"
version = "1.0.1"
description = "缃戞枃闃呰鍒嗘瀽宸ュ叿鍖咃細璇诲畬鍐嶈锛岃蹇呮湁鎹€傛枃椋庨噺鍖?/ 浜虹О鍒ゅ畾 / 棰樻潗楠岃瘉 / 閫佸鑷"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TZ" }]
keywords = ["novel", "webnovel", "chinese", "analysis", "nlp", "literature", "缃戞枃", "灏忚鍒嗘瀽"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Chinese (Simplified)",
]

dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/LZB20877511/tz-novel-analysis"
Repository = "https://github.com/LZB20877511/tz-novel-analysis"
Issues = "https://github.com/LZB20877511/tz-novel-analysis/issues"

[project.scripts]
tznovel = "tznovel.cli:main"

[tool.setuptools.packages.find]
include = ["tznovel*"]

[tool.setuptools.package-data]
tznovel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
